services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
    restart: unless-stopped
    # MCP 是 stdio 子进程，与 API 同容器即可；
    # 若要独立部署，把它拆成单独 service 并把 mcp_client 改为 HTTP 传输。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
